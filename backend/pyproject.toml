[project]
name = "study-copilot-backend"
version = "1.0.0"
description = "AI-powered learning assistant backend (FastAPI + RAG + Quiz)"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pymupdf>=1.23.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "openai>=1.10.0",
    "pydantic>=2.5.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "httpx>=0.26.0",
    "numpy>=1.24.0",
    "aiofiles>=23.2.1",
    "rank-bm25>=0.2.2",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "docling>=2.0.0",
    "edge-tts>=6.0.0",
    "jinja2>=3.1.0",
    "jieba>=0.42.1",
    "trafilatura>=1.6.0",
    "alembic>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.26.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B008",
    "B904",
    "B905",
    "B007",
    "E402",
    "E501",
    "E741",
    "E712",
    "F401",
    "SIM102",
    "SIM110",
    "SIM117",
    "N818",
    "N806",
    "N803",
    "UP042",
    "SIM105",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/*.py" = ["B008"]
"backend/tests/*.py" = ["N806", "N803", "N818", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
# 唯一 pytest 配置源（2026-08-27：删除 pytest.ini——它静默遮蔽本节，
# 导致 asyncio_default_fixture_loop_scope=session 从未生效，
# session 级 fixture 挂函数级事件循环，全量跑必现跨循环 RuntimeError/IntegrityError）
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# 测试也共用 session 级事件循环：app.db 的模块级全局 engine 连接池绑定单循环，
# 函数级循环会在池化连接上触发 "attached to a different loop" RuntimeError，
# 并级联出 IntegrityError 污染（2026-08-27 全量回归定位）
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 覆盖率门禁：本地与 CI 一致强制（当前基线 ~69%，阈值随质量提升棘轮上调）
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=65"

[tool.mypy]
# 渐进式类型检查（2026-08-27 起步）：
# 存量代码 ~357 个函数几乎无类型注解，一次性 strict 会产生数百错误、形同虚设。
# 策略（棘轮式，只紧不松）：全局先立"有意义的宽松基线"——
#   - 所有被 import 的模块照常全量分析（含无注解函数体）
#   - 禁止隐式 Optional；已用 cast/ignore 处必须真实有效
# 新写/重构的模块逐个加入下方 overrides 的严格名单；
# 名单内模块必须完全注解化。CI 以 `mypy app` 为门禁。
python_version = "3.11"
plugins = ["pydantic.mypy"]
# 使下方 numpy 覆盖项的 follow_imports="skip" 对 .pyi 桩文件同样生效
follow_imports_for_stubs = true

# ---- 全局基线（对全部 app/ 代码生效）----
no_implicit_optional = true          # x=None 必须写成 Optional[x]
warn_unused_ignores = true           # type: ignore 用不上了要报（防腐烂）
warn_redundant_casts = true          # 冗余 cast 要报
check_untyped_defs = true            # 无注解函数体也做类型核查

# ---- 第三方库缺类型桩：放行为 Any ----
[[tool.mypy.overrides]]
module = [
    "faiss",
    "jieba",
    "rank_bm25",
    "sentence_transformers",
    "docling.*",
    "edge_tts",
    "trafilatura",
    "fitz",
    "docx",
    "pptx",
    "jose.*",
    "cryptography.*",
    "openai",
    "aiofiles",
]
ignore_missing_imports = true

# numpy 2.x 自带 PEP 695（type 语句）的类型桩，要求解释器目标 ≥3.12；
# 本项目锁定 3.11（Docker 同为 3.11-slim），故跳过其桩按 Any 处理。
# 项目若升级到 3.12+，可删除此段以恢复 numpy 完整类型。
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

# ---- 严格名单：新模块落地后逐个追加到这里 ----
[[tool.mypy.overrides]]
module = [
    "app.api.metrics",
    "app.db.database",
    "app.core.llm",
    "app.core.query_router",
]
disallow_untyped_defs = true         # 函数必须完整注解
disallow_incomplete_defs = true      # 半注解也不行
warn_return_any = true               # 返回 Any 要显式