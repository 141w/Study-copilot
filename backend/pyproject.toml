[project]
name = "study-copilot-backend"
version = "1.0.0"
description = "AI-powered learning assistant backend (FastAPI + RAG + Quiz)"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pymupdf>=1.23.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "openai>=1.10.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "httpx>=0.26.0",
    "numpy>=1.24.0",
    "aiofiles>=23.2.1",
    "rank-bm25>=0.2.2",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "docling>=2.0.0",
    "edge-tts>=6.0.0",
    "jinja2>=3.1.0",
    "jieba>=0.42.1",
    "trafilatura>=1.6.0",
    "alembic>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.26.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B008",
    "B904",
    "B905",
    "B007",
    "E402",
    "E501",
    "E741",
    "E712",
    "F401",
    "SIM102",
    "SIM110",
    "SIM117",
    "N818",
    "N806",
    "N803",
    "UP042",
    "SIM105",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/*.py" = ["B008"]
"backend/tests/*.py" = ["N806", "N803", "N818", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
# 渐进式类型检查（2026-08-27 起步）：
# 存量代码 ~357 个函数几乎无类型注解，一次性 strict 会产生数百错误、形同虚设。
# 策略（棘轮式，只紧不松）：全局先立"有意义的宽松基线"——
#   - 所有被 import 的模块照常全量分析（含无注解函数体）
#   - 禁止隐式 Optional；已用 cast/ignore 处必须真实有效
# 新写/重构的模块逐个加入下方 overrides 的严格名单；
# 名单内模块必须完全注解化。CI 以 `mypy app` 为门禁。
python_version = "3.11"
plugins = ["pydantic.mypy"]

# ---- 全局基线（对全部 app/ 代码生效）----
no_implicit_optional = true          # x=None 必须写成 Optional[x]
warn_unused_ignores = true           # type: ignore 用不上了要报（防腐烂）
warn_redundant_casts = true          # 冗余 cast 要报
check_untyped_defs = true            # 无注解函数体也做类型核查

# ---- 第三方库缺类型桩：放行为 Any ----
[[tool.mypy.overrides]]
module = [
    "faiss",
    "jieba",
    "rank_bm25",
    "sentence_transformers",
    "docling.*",
    "edge_tts",
    "trafilatura",
    "fitz",
    "docx",
    "pptx",
    "jose.*",
    "cryptography.*",
    "numpy",
    "openai",
    "aiofiles",
]
ignore_missing_imports = true

# ---- 严格名单：新模块落地后逐个追加到这里 ----
[[tool.mypy.overrides]]
module = [
    "app.api.metrics",
    "app.db.database",
]
disallow_untyped_defs = true         # 函数必须完整注解
disallow_incomplete_defs = true      # 半注解也不行
warn_return_any = true               # 返回 Any 要显式
