[project]
name = "study-copilot-backend"
version = "1.0.0"
description = "AI-powered learning assistant backend (FastAPI + RAG + Quiz)"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pymupdf>=1.23.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "openai>=1.10.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "httpx>=0.26.0",
    "numpy>=1.24.0",
    "aiofiles>=23.2.1",
    "rank-bm25>=0.2.2",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "docling>=2.0.0",
    "edge-tts>=6.0.0",
    "jinja2>=3.1.0",
    "jieba>=0.42.1",
    "trafilatura>=1.6.0",
    "alembic>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B008",
    "B904",
    "B905",
    "B007",
    "E402",
    "E501",
    "E741",
    "E712",
    "F401",
    "SIM102",
    "SIM110",
    "SIM117",
    "N818",
    "N806",
    "N803",
    "UP042",
    "SIM105",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/*.py" = ["B008"]
"backend/tests/*.py" = ["N806", "N803", "N818", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic"]
