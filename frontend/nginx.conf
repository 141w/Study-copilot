server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（注意：location 内若已有 add_header，需在该 location 重复声明）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'" always;

    # SPA 路由支持。
    # 入口 HTML 必须不缓存：它的文件名没有内容哈希，一旦被浏览器缓存，
    # 重新部署后用户仍会加载旧 HTML 指向的旧哈希资源 —— 表现为"部署成功
    # 但界面没变"，且只能靠强制刷新发现。带哈希的 js/css 由下面的长缓存负责。
    # 注意：本 location 出现 add_header，安全头必须在此重复声明（nginx 继承陷阱）。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'" always;
    }

    # API 代理
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置：LLM 生成/Agentic RAG 流程可能超过 60s，
        # 显式放宽读超时，避免长请求（含 SSE 流式问答）被 nginx 中断
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # SSE 流式响应：关闭缓冲，token 实时下发
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 健康检查代理：后端在 /health 提供 JSON（含数据库探测），
    # 不显式转发的话该路径会被下面的 SPA 规则吃掉、返回 index.html，
    # 导致容器 healthcheck 与外部监控拿不到真实状态。
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 继承陷阱：本 location 已有 add_header，安全头需重复声明
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'" always;
    }
}