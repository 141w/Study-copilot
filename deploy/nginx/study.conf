# Study Copilot —— 与同机个人站共用 80/443，按域名分流
#
# 部署位置：/etc/nginx/sites-available/study，软链到 sites-enabled/
# 关键点：
#   1. 不写 default_server —— 个人站的 vhost 已经是默认主机，重复声明会让
#      nginx 直接启动失败，连带把个人站一起弄挂。
#   2. 应用容器只监听 127.0.0.1:8080，公网入口只有这里的 80/443。
#   3. SSE 流式问答必须关缓冲、拉长读超时，否则"逐字输出"会被攒成整段返回。

# 上传大文档：单文件上限 50MB（与后端 max_file_size 对齐）
client_max_body_size 64m;

# HTTP：先由 certbot 完成域名验证，签发后会被改写为跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name study.wweiqi.devs.surf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 流式：不缓冲、不缓存，token 实时下发；长生成放宽读超时
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
