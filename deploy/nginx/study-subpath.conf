# Study Copilot —— 挂在个人站同域名下的子路径 /study/
#
# 为什么用子路径而不是新子域：唯一那张有效的 Let's Encrypt 证书签给
# wweiqi.devs.surf，复用它可以完全不碰证书（新子域要重新签发，而
# devs.surf 是共享注册域，Let's Encrypt 按注册域限流，已实测撞墙）。
#
# 安装方式：把本文件复制到 /etc/nginx/snippets/study-subpath.conf，
# 然后在 /etc/nginx/snippets/ww-common.conf 里加一行：
#     include /etc/nginx/snippets/study-subpath.conf;
# 一行 include 便于回滚——删掉它个人站配置即恢复原状。
#
# 应用侧配套：构建时 VITE_BASE=/study/（见 .env.example），前端资源与
# 接口路径都带该前缀；本 location 用带尾斜杠的 proxy_pass 剥掉前缀，
# 容器内的应用仍然看到根路径，无需任何改动。

# 少一个尾斜杠也要能进：否则 /study 会落到个人站的 try_files 兜底，
# 静默返回作品集首页而不是应用。
location = /study {
    return 301 /study/;
}

location /study/ {
    # 尾斜杠是关键：/study/api/x → 转发为 /api/x
    proxy_pass http://127.0.0.1:8080/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 流式问答（SSE）：必须关缓冲，否则逐字输出会被攒成整段返回
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # 上传文档：与后端 50MB 上限对齐（留余量）
    client_max_body_size 64m;
}
