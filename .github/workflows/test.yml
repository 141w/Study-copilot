name: CI Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: study_user
          POSTGRES_PASSWORD: study123
          POSTGRES_DB: study_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U study_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://study_user:study123@localhost:5432/study_copilot_test
      JWT_SECRET_KEY: ci-test-secret-key
      OPENAI_API_KEY: sk-dummy
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-3.5-turbo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies with uv
        working-directory: backend
        run: |
          uv pip install --system -e '.[dev]'

      - name: Ruff lint check
        working-directory: backend
        run: |
          uv run ruff check app/ --output-format=github || true

      - name: Type check with mypy
        working-directory: backend
        run: |
          uv run mypy app

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          uv run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=65

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Production build check
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  all-tests-pass:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "Backend: ${{ needs.backend-tests.result }}"
            echo "Frontend: ${{ needs.frontend-tests.result }}"
            exit 1
          fi
          echo "All tests passed!"
