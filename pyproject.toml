[project]
name = "study-copilot"
version = "1.0.0"
description = "AI-powered learning assistant with RAG, quiz generation, and progress tracking"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in default args is standard pattern
    "B904",   # raise from err - many existing raise patterns
    "B905",   # zip without strict= - not always needed
    "B007",   # unused loop variable - common in enumerate patterns
    "E402",   # module level import not at top - sometimes needed for logger setup
    "E501",   # line too long - handled by ruff format for code; strings are fine
    "E741",   # ambiguous variable name (l, O, I) - used in existing code
    "E712",   # SQLAlchemy == False comparisons are intentional
    "F401",   # unused imports in __init__.py - these are re-exports for convenience
    "SIM102", # nested if -> combined if - readability preference
    "SIM110", # for loop -> any() - readability preference
    "SIM117", # nested with -> combined with - readability preference
    "N818",   # Exception naming conventions - allow non-Error suffix
    "N806",   # Variable in function should be lowercase (MockLLM etc in tests)
    "N803",   # Argument name should be lowercase (MockLLM etc in tests)
    "UP042",  # str+Enum 双继承为有意设计（枚举值直接序列化进 LLM prompt）
    "SIM105", # try/except-pass -> contextlib.suppress - 可读性偏好
    "SIM108", # if/else -> ternary - 可读性偏好
]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/*.py" = ["B008"]
"backend/tests/*.py" = ["N806", "N803", "N818", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["backend/tests"]
